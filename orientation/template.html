<!doctype html>
<html lang="{{lang}}" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="{{description}}"><link rel="alternate" hreflang="en" href="orientation.html"><link rel="alternate" hreflang="ko" href="orientation.ko.html"><title>{{title}} · Voice UX Lab</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="orientation/style.css"><script type="module" src="orientation/app.js"></script></head>
<body class="reading"><a class="skip" href="#main">{{skip}}</a><aside class="rail"><a class="wordmark" href="{{weeks}}" aria-label="Voice UX Lab">Voice UX Lab<span class="mark" aria-hidden="true">✳</span></a><nav id="sections" aria-label="{{sections}}"></nav><div class="rail-bottom"><span>2026 / Cohort 05</span><a href="{{weeks}}" id="source">{{back}}</a><a href="{{recap}}">{{recap_label}}</a><a href="{{project}}">Ten Minutes</a></div></aside>
<header class="toolbar"><h1 class="deck-label">{{title}} <span class="date">/ 2026.10.11</span></h1><div class="tools"><div class="languages" role="group" aria-label="{{language}}"><a id="ko" data-language="ko" lang="ko" hreflang="ko" href="orientation.ko.html">KR</a><a id="en" data-language="en" lang="en" hreflang="en" href="orientation.html">EN</a></div><button id="theme"></button><button id="view"></button><button id="fullscreen" aria-label="Fullscreen">⛶</button><button id="overview" aria-label="Slide overview">☷</button></div></header>
<main id="main" tabindex="-1"></main><template id="archive-intro"><nav class="archive-intro" aria-label="{{sections}}"><a href="{{weeks}}">{{back}}</a><a href="{{recap}}">{{recap_label}}</a></nav></template><template id="archive-links"><div class="archive-context"><p>{{historical}}</p><div><a href="{{weeks}}">{{back}}</a><a href="{{recap}}">{{recap_label}}</a><a href="{{project}}">Ten Minutes</a></div></div></template><footer class="controls"><button id="notes"></button><span class="keyboard" id="help"></span><div class="navigation"><button id="prev"></button><span id="counter" aria-live="polite"></span><button id="next"></button></div></footer><div class="progress" aria-hidden="true"><span id="progress"></span></div>
<dialog id="drawer"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close"></button></div><div id="dialog-content"></div></dialog><noscript>{{noscript}} <a href="{{recap}}">{{recap_label}}</a></noscript></body></html>
